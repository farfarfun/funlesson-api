[project]
name = "funlesson-api"
version = "0.1.4"
description = "funlesson 后端服务：封装 funlesson，提供课程链接转大纲/思维导图/PPT/架构图的接口"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "funlesson",
    "typer>=0.12",
]
license = "MIT"

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funlesson-api = "funlesson_api.cli:app"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funlesson-api"
Releases = "https://github.com/farfarfun/funlesson-api/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
